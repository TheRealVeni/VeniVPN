# HomeVPS configuration

HOSTNAME="homevps"

# SSH
SSH_PORT="22"

# Firewall
ALLOW_SSH="yes"
ALLOW_HTTP="yes"
ALLOW_HTTPS="yes"

# Docker
INSTALL_DOCKER="yes"

# Network
# Set these if you have a static LAN configuration.
LAN_INTERFACE=""

# Example:
# LAN_IP="192.168.1.100"
# GATEWAY="192.168.1.1"
